defaults:
  - _autrainer_
  - _self_

results_dir: /path/to/results
experiment_id: qwen
iterations: 30
inference_batch_size: 1
progress_bar: false

hydra:
  sweeper:
    params:
      +seed: 1
      +batch_size: 4
      +learning_rate: 0.001, 0.0001, 0.00001
      dataset: CoarseNet-32k-ML-Edansa-qwen
      model: Qwen2
      optimizer: Adam, AdamW
          